[package]
name = "dolly"
default-run = "dolly"
version = "0.1.0"
description = "Automatic cinematic screen recording for macOS"
authors = ["Dolly contributors"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"
repository = "https://github.com/dollyapp/dolly"

[lib]
name = "dolly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSEvent", "block2"] }
block2 = "0.5"
core-graphics = "0.24"
mach2 = "0.4"
# ScreenCaptureKit capture. Evaluate replacing with a hand-rolled objc2
# binding if `scap` doesn't expose the low-level knobs §6 needs
# (per-frame timestamps at mach_absolute_time resolution, showsCursor=false).
scap = "0.0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
# A newer objc2 generation than objc2-app-kit above (0.6 vs 0.5) — the two
# don't share Retained types, so permissions code built on this stays
# self-contained rather than passing objc2 values across the boundary.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-avf = { package = "objc2", version = "0.6" }
block2-avf = { package = "block2", version = "0.6" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
