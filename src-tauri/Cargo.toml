[package]
name = "dolly"
default-run = "dolly"
version = "0.1.0"
description = "Automatic cinematic screen recording for macOS"
authors = ["Dolly contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
repository = "https://github.com/dollyapp/dolly"

[lib]
name = "dolly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-dialog = "2.7.2"
# Packs a finished recording's meta.json/cursor.json/screen.mov/mic.wav into
# one `.dol` file (see `bundle::container`) — only `deflate` is enabled
# (for the small JSON entries); `screen.mov`/`mic.wav` are stored
# uncompressed (Zip's baseline "Stored" method needs no codec feature at
# all) so `dol_protocol` can serve byte ranges straight off disk without
# decompressing.
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
# Serve `dol://` byte-range requests (HTTP Range parsing) and percent-encode
# the `.dol` path that travels in a `dol://` URL — all already in the tree
# via tauri; pulled in directly so `dol_protocol` can use them.
http = "1"
http-range = "0.1.5"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSEvent", "NSApplication", "NSResponder", "NSRunningApplication", "NSCursor", "block2"] }
block2 = "0.5"
core-graphics = "0.24"
mach2 = "0.4"
# ScreenCaptureKit capture. Evaluate replacing with a hand-rolled objc2
# binding if `scap` doesn't expose the low-level knobs §6 needs
# (per-frame timestamps at mach_absolute_time resolution, showsCursor=false).
scap = "0.0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
# A newer objc2 generation than objc2-app-kit above (0.6 vs 0.5) — the two
# don't share Retained types, so permissions code built on this stays
# self-contained rather than passing objc2 values across the boundary.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings", "AVAsset", "AVAssetTrack", "objc2-core-media", "objc2-core-video", "objc2-core-foundation", "block2"] }
objc2-avf = { package = "objc2", version = "0.6" }
block2-avf = { package = "block2", version = "0.6" }
# Building the AVAssetWriter output-settings dictionary (NSDictionary,
# NSNumber, NSString, NSURL) needs direct access to this objc2 0.6
# generation's Foundation types — objc2-av-foundation only re-exports the
# ones its own method signatures use, not general-purpose constructors.
objc2-foundation-avf = { package = "objc2-foundation", version = "0.3" }
objc2-core-video = "0.3"
objc2-core-media = "0.3"
objc2-core-foundation = "0.3"
# Mic capture (AVAudioEngine). Same objc2 0.6 generation as objc2-av-foundation
# above — kept self-contained in src-tauri/src/audio for the same reason.
objc2-avf-audio = { version = "0.3", default-features = false, features = ["AVAudioEngine", "AVAudioIONode", "AVAudioNode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime", "AVAudioTypes", "block2"] }
# System audio capture (ScreenCaptureKit `SCStream` audio output). Same objc2
# 0.6 generation again. `SCStreamOutput`'s callback method only exists under
# the `objc2-core-media` feature (it takes a `CMSampleBuffer`); the sample
# handler queue needs `dispatch2`.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["SCStream", "SCShareableContent", "block2", "dispatch2", "objc2-core-media"] }
# `objc2-screen-capture-kit` uses `DispatchQueue` in `addStreamOutput:...` but
# doesn't re-export it — pull in the crate directly to name the type.
dispatch2 = "0.3"
# `AudioBufferList`/`AudioStreamBasicDescription`/`kAudioFormat*` live in
# objc2-core-audio-types, which objc2-core-media doesn't re-export.
objc2-core-audio-types = "0.3"
# Pure-Rust WAV writer — sidesteps AVAudioFile's own FFI surface (NSURL,
# settings dictionaries) entirely; we already have raw float samples once
# the tap block fires.
hound = "3"

[dev-dependencies]
tempfile = "3"

# `scap` 0.0.8's window-target dimension/scale-factor lookup is broken for
# any window not owned by this process (see vendor/scap/PATCH.md) — which
# is every real capture target — silently making window capture fall back
# to recording the whole display. Patched locally pending an upstream fix.
[patch.crates-io]
scap = { path = "vendor/scap" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
